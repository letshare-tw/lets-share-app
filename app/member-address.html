<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>樂享家｜會員住家地址</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#173b2a;background:#078b50}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:auto;padding:28px 16px}.brand{text-align:center;color:white;margin-bottom:24px}.brand h1{margin:0}.card{background:white;padding:24px;border-radius:22px}label{display:block;font-weight:700;margin:18px 0 6px}input,textarea{width:100%;padding:14px;border:1px solid #bdcfc2;border-radius:12px;font:inherit}textarea{min-height:90px}button,a.action{display:block;width:100%;background:#078b50;color:white;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:14px;margin-top:16px;font:inherit;font-weight:700}a.action{background:#e9f4ed;color:#11653b}p{line-height:1.6}#status{white-space:pre-wrap;color:#486b56;font-size:14px}button:disabled{opacity:.5}</style></head><body><main class="wrap"><header class="brand"><h1>樂享家</h1><p>會員資料｜住家地址</p></header><section class="card"><h2>我的住家地址</h2><p>此地址為分享衣物時的預設取件地址。變更地址不會自動變更已成立的取件任務。</p><p id="identity">正在確認登入…</p><label for="address">住家地址</label><input id="address" maxlength="300" autocomplete="street-address" placeholder="請填寫完整住家地址"><label for="note">家門口放置說明（選填）</label><textarea id="note" maxlength="300" placeholder="例如：大門右側鞋櫃旁"></textarea><button id="save" disabled>儲存會員地址</button><p id="status" role="status">請先確認會員登入狀態。</p><a class="action" href="./c09.html">返回分享衣物測試</a><a class="action" href="./">返回樂享家 APP</a></section></main><script>(()=>{'use strict';const BASE='https://wxvauoeykusmbxdtwgxo.supabase.co',KEY='sb_publishable_ZCqKEuqpTiZ46p9fx_JXvA_av4JwD3I',STORE='lx_supabase_auth_v066g';const $=id=>document.getElementById(id);let token=null;function session(){try{return JSON.parse(sessionStorage.getItem(STORE)||'null')}catch{return null}}async function rpc(name,body={}){if(!token)throw Error('尚未登入。請先回 APP 登入，再從相同分頁進入此頁。');const res=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok){let msg='伺服器錯誤 '+res.status;try{const j=await res.json();msg=j.message||msg}catch{}throw Error(msg)}return res.json()}async function init(){token=session()?.token||null;if(!token){$('identity').textContent='未偵測到登入狀態';$('status').textContent='請先回 APP 登入。';return}try{const rows=await rpc('lx_get_my_home_address');$('address').value=rows?.[0]?.address_text||'';$('note').value=rows?.[0]?.placement_note||'';$('identity').textContent='已連接會員資料';$('save').disabled=false;$('status').textContent='可在這裡更新住家地址。'}catch(e){$('identity').textContent='讀取失敗';$('status').textContent=e.message}}$('save').onclick=async()=>{const address=$('address').value.trim();if(address.length<5){$('status').textContent='請輸入至少 5 字的完整地址';return}$('save').disabled=true;try{await rpc('lx_update_my_home_address',{p_address:address,p_note:$('note').value.trim()||null});$('status').textContent='✓ 會員住家地址已儲存。分享頁將自動帶入。'}catch(e){$('status').textContent='儲存失敗：'+e.message}finally{$('save').disabled=false}};init()})();</script></body></html>

<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>樂享家｜分享衣物地點測試</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#173b2a;background:#078b50}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:auto;padding:24px 16px 48px}.head{text-align:center;color:white;margin:8px 0 25px}.head h1{margin:0;font-size:30px}.head p{margin:8px 0;font-size:14px}.card{background:#fff;border-radius:22px;padding:23px 20px;box-shadow:0 8px 30px #00381b24}h2{margin:0 0 10px;font-size:22px}h3{font-size:17px;margin:25px 0 10px}.muted{color:#64776c;font-size:14px;line-height:1.7}.option{display:flex;gap:10px;align-items:center;border:1px solid #dce8df;border-radius:14px;padding:13px;margin:9px 0;cursor:pointer}.option:has(input:checked){background:#e8f7ee;border-color:#078b50}input[type=radio]{accent-color:#078b50}input[type=text],textarea,select{width:100%;padding:13px;border:1px solid #bfcfc5;border-radius:12px;font:inherit;margin:6px 0 12px;background:white;color:#173b2a}textarea{min-height:75px}button,.link{display:block;text-align:center;width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;background:#078b50;color:white;font-size:16px;font-weight:700;text-decoration:none}button:disabled{opacity:.45}button.secondary{background:#eef5f0;color:#12633c}.hidden{display:none}#preview{max-width:100%;max-height:260px;border-radius:12px;display:none;margin:12px auto}#status{padding:12px;border-radius:10px;background:#f0f5f1;color:#315843;margin-top:14px;white-space:pre-wrap;font-size:14px;line-height:1.6}.warn{background:#fff6df!important;color:#755619!important}.footer{color:#dff5e8;text-align:center;font-size:12px;margin-top:20px}label.field{font-size:14px;font-weight:700}input[type=file]{max-width:100%;margin:12px 0}
</style></head><body><main class="wrap"><header class="head"><h1>樂享家</h1><p>分享，讓美好開始傳遞</p></header><section class="card"><h2>分享袋放置地點</h2><p class="muted">預設在住家門口交付。若需使用集貨點，請自行切換選擇。</p><div id="identity" class="muted">正在確認登入狀態…</div><h3>選擇交付方式</h3><label class="option"><input type="radio" name="kind" value="home" checked>🏠 自家門口（預設）</label><label class="option"><input type="radio" name="kind" value="collection_point">📍 樂享家核准集貨點</label><div id="home"><label class="field" for="address">住家取件地址（必填）</label><input id="address" type="text" maxlength="300" placeholder="例如：臺南市○○區○○路○號"><label class="field" for="homeNote">放置位置說明（選填）</label><textarea id="homeNote" placeholder="例如：大門右側鞋櫃旁"></textarea><button id="saveAddress" type="button">儲存我的預設取件地址</button></div><div id="point" class="hidden"><label class="field" for="pointSelect">選擇已核准集貨點</label><select id="pointSelect"><option value="">讀取中…</option></select><p class="muted" id="pointInfo">僅顯示總部核准且已啟用的地點。</p></div><h3>拍攝分享袋現場照片</h3><p class="muted">請先將封好的分享袋放在指定位置，再拍攝袋件與周圍環境，方便騎手辨識。避免拍到人臉或其他不必要的個人資料。</p><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><img id="preview" alt="分享袋放置照片預覽"><p class="muted" id="photoInfo">尚未選擇照片。此測試版僅在手機本機預覽，不會上傳照片。</p><label class="option"><input type="checkbox" id="placed">我已將封好的分享袋放在所選位置，照片是實際現場。</label><button id="test" type="button">檢查申報資料</button><div id="status" role="status">此為 C09-03 測試頁。正式申報尚未開放，不會派遣騎手。</div><a class="link" href="./">返回樂享家 APP</a></section><p class="footer">樂享家 C09-03 · 測試版 · 不建立正式取件任務</p></main><script>
(()=>{'use strict';const BASE='https://wxvauoeykusmbxdtwgxo.supabase.co',KEY='sb_publishable_ZCqKEuqpTiZ46p9fx_JXvA_av4JwD3I',STORE='lx_supabase_auth_v066g';const $=id=>document.getElementById(id);let user=null,token=null,points=[];function status(msg,warn=false){$('status').textContent=msg;$('status').className=warn?'warn':''}function session(){try{return JSON.parse(sessionStorage.getItem(STORE)||'null')}catch{return null}}function jwtUserId(jwt){try{const part=jwt.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(part)).sub||null}catch{return null}}async function api(path,options={}){if(!token)throw Error('請先從 APP 登入後再開啟此頁');const res=await fetch(BASE+'/rest/v1/'+path,{...options,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})}});if(!res.ok){let detail='';try{const j=await res.json();detail=j.message||j.error||''}catch{}throw Error(detail||'伺服器回應 '+res.status)}if(res.status===204)return null;const t=await res.text();return t?JSON.parse(t):null}function selectedKind(){return document.querySelector('input[name=kind]:checked').value}function toggle(){const home=selectedKind()==='home';$('home').classList.toggle('hidden',!home);$('point').classList.toggle('hidden',home)}document.querySelectorAll('input[name=kind]').forEach(e=>e.addEventListener('change',toggle));$('saveAddress').onclick=async()=>{try{if(!user)throw Error('尚未登入');const address=$('address').value.trim();if(address.length<5)throw Error('請填寫完整住家取件地址');$('saveAddress').disabled=true;await api('lx_member_pickup_addresses?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:user,address_text:address,placement_note:$('homeNote').value.trim()||null})});status('住家預設取件地址已儲存。\n注意：尚未成立投袋申報。')}catch(e){status('儲存失敗：'+e.message,true)}finally{$('saveAddress').disabled=false}};$('pointSelect').onchange=()=>{const p=points.find(x=>x.id===$('pointSelect').value);$('pointInfo').textContent=p?`${p.address_text}${p.placement_note?'\n指定位置：'+p.placement_note:''}`:'僅顯示總部核准且已啟用的地點。'};$('photo').onchange=()=>{const file=$('photo').files?.[0];const img=$('preview');if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);img.style.display='none';img.removeAttribute('src');img.dataset.url='';if(!file){$('photoInfo').textContent='尚未選擇照片';return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024){$('photo').value='';$('photoInfo').textContent='僅接受 JPG、PNG、WEBP，檔案不得超過 10 MB';return}img.dataset.url=URL.createObjectURL(file);img.src=img.dataset.url;img.style.display='block';$('photoInfo').textContent=`已選取 ${file.name}（僅本機預覽，尚未上傳）`};$('test').onclick=()=>{if(!user)return status('尚未登入，請先返回 APP 登入。',true);if(selectedKind()==='home'&&$('address').value.trim().length<5)return status('請先填寫住家取件地址。',true);if(selectedKind()==='collection_point'&&!$('pointSelect').value)return status('請先選擇總部核准的集貨點。',true);if(!$('photo').files?.length)return status('請先拍攝分享袋放置現場照片。',true);if(!$('placed').checked)return status('請勾選確認分享袋已放置完成。',true);status('✓ 交付地點已選擇\n✓ 現場照片已選取\n✓ 放置確認已勾選\n\n本次僅完成前端資料檢查。照片未上傳、未正式申報、未派工、48 小時尚未起算。')};async function init(){const s=session();token=s?.token||null;user=token?jwtUserId(token):null;if(!user){$('identity').textContent='尚未取得登入狀態。請先在樂享家 APP 登入，並由同一瀏覽器分頁開啟此頁。';$('saveAddress').disabled=true;$('pointSelect').innerHTML='<option value="">請先登入</option>';return}$('identity').textContent='✓ 已偵測到會員登入狀態';try{const a=await api('lx_member_pickup_addresses?select=address_text,placement_note&limit=1');if(a?.length){$('address').value=a[0].address_text||'';$('homeNote').value=a[0].placement_note||''}}catch(e){status('讀取住家地址失敗：'+e.message,true)}try{points=await api('lx_approved_collection_points?select=id,name,address_text,placement_note&enabled=eq.true&order=name.asc')||[];$('pointSelect').innerHTML='<option value="">請選擇集貨點</option>';for(const p of points){const opt=document.createElement('option');opt.value=p.id;opt.textContent=p.name;$('pointSelect').appendChild(opt)}if(!points.length)$('pointInfo').textContent='目前沒有總部核准並開放使用的集貨點，請選擇住家門口。'}catch(e){$('pointSelect').innerHTML='<option value="">無法載入集貨點</option>';status('讀取集貨點失敗：'+e.message,true)}}init()})();
</script></body></html>

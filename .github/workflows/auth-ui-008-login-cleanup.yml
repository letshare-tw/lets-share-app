
name: AUTH-UI-008 Login Entry Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix login entries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gate = Path("mod-preview/lx-test-gate.js")
          app = Path("mod-preview/js/legacy-01.js")
          g = gate.read_text(encoding="utf-8")
          a = app.read_text(encoding="utf-8")

          old_email = 'mode === "login" ? "block" : "none";'
          email_line = 'el("lx-v15-email").style.display ='
          old_splash = '<button class="primary outline" onclick="lxOpenRealLogin()">會員登入（Supabase）</button>'

          if "AUTH-UI-008" in g and "AUTH-UI-008" in a:
              print("Already installed")
              raise SystemExit(0)

          if "AUTH-UI-008" in g or "AUTH-UI-008" in a:
              raise SystemExit("Partial installation")

          start = g.find(email_line)
          if start < 0:
              raise SystemExit("Email display missing")

          end = g.find(old_email, start)
          if end < 0 or end - start > 120:
              raise SystemExit("Email rule missing")

          g = (
              g[:start]
              + '/* AUTH-UI-008 */\n    '
              + email_line
              + ' "none";'
              + g[end + len(old_email):]
          )

          if a.count(old_splash) != 1:
              raise SystemExit("Splash button missing")

          a = a.replace(
              old_splash,
              '<!-- AUTH-UI-008: legacy login hidden -->',
              1
          )

          gate.write_text(g, encoding="utf-8")
          app.write_text(a, encoding="utf-8")
          print("AUTH-UI-008 installed")
          PY

      - name: Check JavaScript
        run: |
          node --check mod-preview/lx-test-gate.js
          node --check mod-preview/js/legacy-01.js

      - name: Verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g = Path("mod-preview/lx-test-gate.js").read_text()
          a = Path("mod-preview/js/legacy-01.js").read_text()
          assert "AUTH-UI-008" in g
          assert "AUTH-UI-008" in a
          assert 'el("lx-v15-email").style.display = "none";' in g
          assert "lx_can_access_test_app" in g
          assert "會員登入（Supabase）</button>" not in a
          assert 'onclick="lxGoogleLogin()"' in a
          print("Verified")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod-preview/lx-test-gate.js mod-preview/js/legacy-01.js
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "AUTH-UI-008 login cleanup"
            git push
          fi

name: DEPLOY-03 Gate 2 isolated readiness
on:
  push:
    branches: ['test/dev01b-v5-gate1-20261108']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  gate2-offline-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gate 2 isolation and integration contract
        run: python3 .gate1/tests/gate2-readiness.py | tee gate2-readiness.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate2-readiness-evidence
          path: gate2-readiness.log
          if-no-files-found: warn
      - name: Publish Gate 2 readiness run URL (not deployment approval)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "$JOB_STATUS" == success ]]; then state=success; fi
          jq -n --arg state "$state" --arg target_url "https://github.com/$GH_REPOSITORY/actions/runs/$GH_RUN_ID" '{state:$state,target_url:$target_url,description:"Gate 2 offline readiness only; no remote deployment",context:"DEPLOY-03/Gate-2-Readiness"}' > /tmp/gate2-status.json
          curl --fail-with-body --silent --show-error --retry 3 -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data-binary @/tmp/gate2-status.json "https://api.github.com/repos/$GH_REPOSITORY/statuses/$GH_SHA"

name: DEPLOY-03 Gate 2 isolated readiness
on:
  push:
    branches: ['test/dev01b-v5-gate1-20261108']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  gate2-local-browser-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check C09 V5 JavaScript runtime syntax
        run: deno check app/c09-v5.js
      - name: Install isolated headless Chromium
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Exercise real Chromium C09 V5 fail-closed browser behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory app >/tmp/gate2-browser-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node .gate1/tests/p1-browser.cjs | tee gate2-browser-runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate2-local-browser-evidence
          path: gate2-browser-runtime.log
          if-no-files-found: warn
  gate2-offline-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gate 2 isolation and integration contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .gate1/tests/gate2-readiness.py | tee gate2-readiness.log
      - name: Check local integration runtime and report integrity
        shell: bash
        run: |
          set -euo pipefail
          # Match Gate 1 source-integrity policy; its mutable workflow is excluded.
          grep -v -F '  .github/workflows/dev01b-v5-gate1.yml' .gate1/CI-SHA256SUMS | sha256sum -c -
          python3 -m py_compile .gate1/tests/gate2-readiness.py .gate1/tests/report_gate.py
          test -f .gate1/runtime/p1-browser-server.ts
          test -f .gate1/runtime/edge-submit-candidate.sql
          test -f .gate1/tests/p1-browser-e2e.cjs
          echo 'PASS Gate2 local integration prerequisites and integrity'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate2-readiness-evidence
          path: gate2-readiness.log
          if-no-files-found: warn
  gate2-result:
    if: always() && github.ref == 'refs/heads/test/dev01b-v5-gate1-20261108'
    needs: [gate2-offline-readiness, gate2-local-browser-runtime]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both Gate 2 jobs to pass
        id: gate
        env:
          READINESS_RESULT: ${{ needs.gate2-offline-readiness.result }}
          BROWSER_RESULT: ${{ needs.gate2-local-browser-runtime.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Gate 2 readiness: $READINESS_RESULT; Chromium: $BROWSER_RESULT"
          [[ "$READINESS_RESULT" == success && "$BROWSER_RESULT" == success ]]
      - name: Publish aggregated Gate 2 run URL and verdict
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          READINESS_RESULT: ${{ needs.gate2-offline-readiness.result }}
          BROWSER_RESULT: ${{ needs.gate2-local-browser-runtime.result }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          if [[ "$READINESS_RESULT" == success && "$BROWSER_RESULT" == success ]]; then state=success; fi
          jq -n --arg state "$state" --arg target_url "https://github.com/$GH_REPOSITORY/actions/runs/$GH_RUN_ID" '{state:$state,target_url:$target_url,description:"Gate 2 offline readiness + isolated Chromium; no hosted deployment",context:"DEPLOY-03/Gate-2-Readiness"}' > /tmp/gate2-status.json
          curl --fail-with-body --silent --show-error --retry 3 -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data-binary @/tmp/gate2-status.json "https://api.github.com/repos/$GH_REPOSITORY/statuses/$GH_SHA"

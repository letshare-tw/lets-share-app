
name: AUTH-UI-006 Account Management

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect account management to profile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("mod-preview/js/legacy-15.js")
          s=p.read_text(encoding="utf-8")

          old='''onclick="lxOpenRealLogin()">帳號管理'''
          new='''onclick="window.lxOpenMemberPanel('profile')">帳號管理'''

          if new in s:
              print("Already installed")
              raise SystemExit(0)

          if s.count(old)!=1:
              raise SystemExit("Account management button not found")

          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          print("AUTH-UI-006 installed")
          PY

      - name: Check JavaScript syntax
        run: node --check mod-preview/js/legacy-15.js

      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("mod-preview/js/legacy-15.js").read_text()
          assert """onclick="window.lxOpenMemberPanel('profile')">帳號管理""" in s
          assert 'onclick="lxMemberSignOut()">登出' in s
          print("AUTH-UI-006 verified")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod-preview/js/legacy-15.js
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "AUTH-UI-006 account management entry"
            git push
          fi

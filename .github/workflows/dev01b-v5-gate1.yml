name: DEV-01B V5 Gate 1 isolated runtime
on:
  push:
    branches: ['test/dev01b-v5-gate1-20261108']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  isolated-pg17:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: gate1_local_only
          POSTGRES_DB: gate1
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gate1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: gate1_local_only
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: gate1
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned DEV-01B source inputs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check .gate1/SHA256SUMS
      - name: PostgreSQL 17 runtime and isolated transaction rollback
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -Atc "SHOW server_version;" | tee pg-version.txt
          test "$(psql -X -Atc 'SHOW server_version_num')" -ge 170000
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          BEGIN;
          CREATE SCHEMA gate1_smoke;
          CREATE TABLE gate1_smoke.rollback_probe (id integer primary key);
          INSERT INTO gate1_smoke.rollback_probe VALUES (1);
          DO $$ BEGIN
            IF (SELECT count(*) FROM gate1_smoke.rollback_probe) <> 1 THEN
              RAISE EXCEPTION 'transaction insert failed';
            END IF;
          END $$;
          ROLLBACK;
          DO $$ BEGIN
            IF to_regclass('gate1_smoke.rollback_probe') IS NOT NULL THEN
              RAISE EXCEPTION 'rollback failed';
            END IF;
          END $$;
          SQL
          echo 'PASS: PostgreSQL 17 isolated transaction rollback' | tee pg-result.txt
      - name: Apply DEV-01B V5 ledger migration and assert grants
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f .gate1/dev01b/ledger_design.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname='dev01b_test') THEN RAISE EXCEPTION 'ledger schema absent'; END IF;
            IF has_schema_privilege('authenticated','dev01b_test','USAGE') OR has_schema_privilege('anon','dev01b_test','USAGE') THEN RAISE EXCEPTION 'ledger schema exposed'; END IF;
            IF has_function_privilege('authenticated','public.dev01b_v5_claim(text,uuid,boolean)','EXECUTE') OR has_function_privilege('anon','public.dev01b_v5_claim(text,uuid,boolean)','EXECUTE') THEN RAISE EXCEPTION 'claim exposed'; END IF;
            IF NOT has_function_privilege('service_role','public.dev01b_v5_claim(text,uuid,boolean)','EXECUTE') THEN RAISE EXCEPTION 'service role missing grant'; END IF;
          END $$;
          SQL
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO dev01b_test.runs(run_id,create_until,cleanup_until)
          VALUES ('dev01b-v5-0123456789abcdef',now()+interval '10 minutes',now()+interval '20 minutes');
          DO $gate$
          DECLARE
            owner_id uuid := '11111111-1111-4111-8111-111111111111';
            other_id uuid := '22222222-2222-4222-8222-222222222222';
            fence bigint;
            resource_count integer;
          BEGIN
            fence := public.dev01b_v5_claim('dev01b-v5-0123456789abcdef',owner_id,false);
            IF fence <> 1 THEN RAISE EXCEPTION 'first fence token incorrect'; END IF;
            PERFORM public.dev01b_v5_renew('dev01b-v5-0123456789abcdef',owner_id,fence);
            PERFORM public.dev01b_v5_event('dev01b-v5-0123456789abcdef',owner_id,fence,
              '33333333-3333-4333-8333-333333333333','intent','draft','a','draft-fixture','intent');
            SELECT count(*) INTO resource_count FROM dev01b_test.resources
              WHERE run_id='dev01b-v5-0123456789abcdef' AND state='intent';
            IF resource_count <> 1 THEN RAISE EXCEPTION 'resource ledger intent not recorded'; END IF;
            BEGIN
              PERFORM public.dev01b_v5_renew('dev01b-v5-0123456789abcdef',other_id,fence);
              RAISE EXCEPTION 'wrong lease owner was accepted';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM <> 'lease_stale_or_expired' THEN RAISE; END IF;
            END;
            PERFORM public.dev01b_v5_release('dev01b-v5-0123456789abcdef',owner_id,fence);
          END $gate$;
          ROLLBACK;
          DO $gate$
          BEGIN
            IF EXISTS(SELECT 1 FROM dev01b_test.runs WHERE run_id='dev01b-v5-0123456789abcdef')
              THEN RAISE EXCEPTION 'fixture survived rollback'; END IF;
          END $gate$;
          SQL
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $gate$
          DECLARE
            fn record;
          BEGIN
            FOR fn IN
              SELECT p.oid, p.proname
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname='public' AND p.proname LIKE 'dev01b_v5_%'
            LOOP
              IF NOT (SELECT prosecdef FROM pg_proc WHERE oid=fn.oid) THEN
                RAISE EXCEPTION 'SECURITY DEFINER missing: %',fn.proname;
              END IF;
              IF NOT (SELECT EXISTS(
                SELECT 1 FROM unnest((SELECT proconfig FROM pg_proc WHERE oid=fn.oid)) setting
                WHERE setting IN ('search_path=','search_path=""')
              )) THEN RAISE EXCEPTION 'hardened search_path missing: %',fn.proname; END IF;
              IF has_function_privilege('anon',fn.oid,'EXECUTE')
                 OR has_function_privilege('authenticated',fn.oid,'EXECUTE')
                 OR EXISTS (SELECT 1 FROM pg_proc p, unnest(p.proacl) a WHERE p.oid=fn.oid AND a::text LIKE '=%') THEN
                RAISE EXCEPTION 'unauthorized EXECUTE: %',fn.proname;
              END IF;
              IF NOT has_function_privilege('service_role',fn.oid,'EXECUTE') THEN
                RAISE EXCEPTION 'service_role EXECUTE missing: %',fn.proname;
              END IF;
            END LOOP;
            IF (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname='public' AND p.proname LIKE 'dev01b_v5_%') <> 5 THEN
              RAISE EXCEPTION 'expected exactly five ledger functions';
            END IF;
          END $gate$;
          SQL
          echo 'PASS: all five SECURITY DEFINER search_path and EXECUTE policies' | tee security-result.txt
          echo 'PASS: V5 ledger migration and basic grants' | tee ledger-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          if-no-files-found: error
          name: gate1-pg17-smoke
          path: |
            pg-version.txt
            pg-result.txt
            ledger-result.txt
            security-result.txt
  v5-pg17-migration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: gate1_local_only
          POSTGRES_DB: gate1_v5
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gate1_v5"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: gate1_local_only
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: gate1_v5
    steps:
      - uses: actions/checkout@v4
      - name: Verify six pinned original sources
        run: sha256sum --check .gate1/SHA256SUMS
      - name: Build isolated Supabase-compatible database mocks
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          SQL
          psql -X -v ON_ERROR_STOP=1 -f .gate1/dev01b/supabase_pg17_mock.sql
      - name: Compile full V5 security migration in isolated PG17
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c 'SET check_function_bodies = on;' -f .gate1/dev01b/SECURITY-V5-REVIEW.sql |& tee v5-migration-result.txt
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $gate$
          BEGIN
            IF (SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'lx_%') < 8 THEN
              RAISE EXCEPTION 'V5 public tables missing';
            END IF;
            IF (SELECT submission_enabled FROM public.lx_share_submission_settings WHERE id=1) IS DISTINCT FROM false THEN
              RAISE EXCEPTION 'V5 submission unexpectedly enabled';
            END IF;
            IF has_function_privilege('authenticated','public.lx_submit_share_request(uuid,text,boolean,boolean,boolean)','EXECUTE')
              OR has_function_privilege('anon','public.lx_submit_share_request(uuid,text,boolean,boolean,boolean)','EXECUTE') THEN
              RAISE EXCEPTION 'V5 submit exposed';
            END IF;
          END $gate$;
          SQL
          echo 'PASS: isolated V5 migration and baseline restrictions' | tee v5-baseline-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          if-no-files-found: error
          name: gate1-v5-pg17-migration
          path: |
            v5-migration-result.txt
            v5-baseline-result.txt
  deno-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned DEV-01B source inputs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check .gate1/SHA256SUMS
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno runtime and project source availability
        shell: bash
        run: |
          set -euo pipefail
          deno --version | tee deno-version.txt
          deno check .gate1/dev01b/index.ts .gate1/dev01b/retired.ts |& tee deno-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          if-no-files-found: error
          name: gate1-deno-check
          path: |
            deno-version.txt
            deno-result.txt

  v5-transaction-rls:
    if: github.ref == 'refs/heads/test/dev01b-v5-gate1-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: gate1_local_only
          POSTGRES_DB: gate1_transaction
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gate1_transaction"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: gate1_local_only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: gate1_transaction
    steps:
      - uses: actions/checkout@v4
      - name: Verify original and additional source integrity
        run: |
          set -euo pipefail
          sha256sum --check .gate1/SHA256SUMS
          grep -v -F '  .github/workflows/dev01b-v5-gate1.yml' .gate1/CI-SHA256SUMS | sha256sum --check
          mkdir -p .gate1-artifacts
      - name: Build PG17.11 synthetic Auth and Storage fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;'
          psql -X -v ON_ERROR_STOP=1 -f .gate1/dev01b/supabase_pg17_mock.sql
          psql -X -v ON_ERROR_STOP=1 -f .gate1/dev01b/SECURITY-V5-REVIEW.sql |& tee .gate1-artifacts/migration.log
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT has_function_privilege('authenticated','public.lx_attach_my_draft_placement(uuid,text,uuid,text,text)','EXECUTE')" | tee .gate1-artifacts/original-legacy-acl.txt
          psql -X -v ON_ERROR_STOP=1 -f .gate1/tests/compatibility-fix.sql
          psql -X -v ON_ERROR_STOP=1 -f .gate1/tests/assertions.sql
          psql -X -v ON_ERROR_STOP=1 -f .gate1/tests/fixtures.sql |& tee .gate1-artifacts/fixtures.log
      - name: Execute original assertion matrix with reviewed transaction-time fixture fix
        shell: bash
        run: |
          set -euo pipefail
          source .gate1/tests/fixture-env.sh
          python3 .gate1/tests/prepare_original_transaction.py
          psql -X -v ON_ERROR_STOP=1 -v a_uid="$a_uid" -v b_uid="$b_uid" -v a_request="$a_request" -v b_request="$b_request" -v a_photo="$a_photo" -v b_photo="$b_photo" -f .gate1-artifacts/transaction-ci.psql |& tee .gate1-artifacts/original-transaction.log
          psql -X -v ON_ERROR_STOP=1 -f .gate1/tests/postflight-assert.psql |& tee .gate1-artifacts/postflight-original.log
      - name: Strict SQLSTATE successful submit and mid-write rollback assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 .gate1/tests/build_strict_transaction.py
          psql -X -v ON_ERROR_STOP=1 -f .gate1-artifacts/strict-transaction.psql |& tee .gate1-artifacts/strict-transaction.log
          psql -X -v ON_ERROR_STOP=1 -f .gate1/tests/postflight-assert.psql |& tee .gate1-artifacts/postflight-strict.log
      - name: Actual restricted-role Auth RLS Storage policy tests
        shell: bash
        run: |
          set -euo pipefail
          source .gate1/tests/fixture-env.sh
          psql -X -v ON_ERROR_STOP=1 -v a_uid="$a_uid" -v b_uid="$b_uid" -v a_request="$a_request" -v b_request="$b_request" -f .gate1/tests/rls.psql |& tee .gate1-artifacts/rls.log
          psql -X -v ON_ERROR_STOP=1 -f .gate1/tests/postflight-assert.psql |& tee .gate1-artifacts/postflight-rls.log
      - name: Execute scoped original cleanup and assert zero leftovers
        shell: bash
        run: |
          set -euo pipefail
          source .gate1/tests/fixture-env.sh
          psql -X -v ON_ERROR_STOP=1 -v a_uid="$a_uid" -v b_uid="$b_uid" -v a_request="$a_request" -v b_request="$b_request" -f .gate1/dev01b/cleanup_drafts.psql |& tee .gate1-artifacts/cleanup.log
          psql -X -v ON_ERROR_STOP=1 -f .gate1/tests/cleanup-assert.sql |& tee .gate1-artifacts/cleanup-assert.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          if-no-files-found: error
          name: gate1-v5-transaction-rls
          path: .gate1-artifacts/

  local-supabase-api:
    if: github.ref == 'refs/heads/test/dev01b-v5-gate1-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify source integrity and enforce no hosted credentials
        run: |
          set -euo pipefail
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          sha256sum --check .gate1/SHA256SUMS
          grep -v -F '  .github/workflows/dev01b-v5-gate1.yml' .gate1/CI-SHA256SUMS | sha256sum --check
          mkdir -p .gate1-artifacts
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Start completely local Supabase Auth PostgREST Storage stack
        shell: bash
        run: |
          set -euo pipefail
          supabase init --workdir .gate1/local-stack
          python3 .gate1/runtime/prepare_local.py config
          set +e
          supabase start --workdir .gate1/local-stack --exclude studio,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor,realtime > .gate1/local-stack/start.private.log 2>&1
          rc=$?
          set -e
          python3 .gate1/runtime/prepare_local.py redact
          cat .gate1-artifacts/local-stack-start.log
          test "$rc" -eq 0
          supabase status --workdir .gate1/local-stack -o json > .gate1/local-stack/status.private.json
          python3 .gate1/runtime/prepare_local.py env >> "$GITHUB_ENV"
      - name: Apply real local schema ledger and reviewed supplements
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -Atc 'SHOW server_version' | tee .gate1-artifacts/local-db-version.txt
          test "$(psql -X -Atc 'SHOW server_version_num')" -ge 170000
          test "$(psql -X -Atc 'SHOW server_version_num')" -lt 180000
          psql -X -v ON_ERROR_STOP=1 -f .gate1/dev01b/SECURITY-V5-REVIEW.sql |& tee .gate1-artifacts/local-v5-migration.log
          psql -X -v ON_ERROR_STOP=1 -f .gate1/tests/compatibility-fix.sql
          psql -X -v ON_ERROR_STOP=1 -f .gate1/dev01b/ledger_design.sql
          psql -X -v ON_ERROR_STOP=1 -f .gate1/runtime/internal-submit.sql
          psql -X -v ON_ERROR_STOP=1 -f .gate1/runtime/local-ledger-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
          deno check .gate1/runtime/fixtures.ts .gate1/runtime/submit_api.ts .gate1/runtime/windows.ts .gate1/dev01b/index.ts
          deno cache .gate1/runtime/fixtures.ts .gate1/runtime/submit_api.ts .gate1/runtime/windows.ts .gate1/dev01b/index.ts .gate1/dev01b/retired.ts
      - name: Real Auth Storage original Edge input authorization retry tests
        shell: bash
        run: |
          set -euo pipefail
          deno run --cached-only --no-prompt --deny-net=rfwqcrvxyjhtmafnbuyy.supabase.co --allow-net=127.0.0.1,localhost --allow-env --allow-read=.gate1,.gate1-artifacts/local-fixture-manifest.json --allow-write=.gate1-artifacts,.gate1/local-stack .gate1/runtime/fixtures.ts prepare |& tee .gate1-artifacts/original-edge-fixtures.log
          python3 .gate1/runtime/prepare_local.py fixture-env
          deno run --cached-only --no-prompt --deny-net=rfwqcrvxyjhtmafnbuyy.supabase.co --allow-net=127.0.0.1,localhost --allow-env --allow-read=.gate1,.gate1-artifacts/local-fixture-manifest.json --allow-write=.gate1-artifacts,.gate1/local-stack .gate1/runtime/windows.ts creation |& tee .gate1-artifacts/window-creation.log
          deno run --cached-only --no-prompt --deny-net=rfwqcrvxyjhtmafnbuyy.supabase.co --allow-net=127.0.0.1,localhost --allow-env --allow-read=.gate1,.gate1-artifacts/local-fixture-manifest.json --allow-write=.gate1-artifacts,.gate1/local-stack .gate1/runtime/windows.ts cleanup |& tee .gate1-artifacts/window-cleanup.log
          deno run --cached-only --no-prompt --deny-net=rfwqcrvxyjhtmafnbuyy.supabase.co --allow-net=127.0.0.1,localhost --allow-env --allow-read=.gate1,.gate1-artifacts/local-fixture-manifest.json --allow-write=.gate1-artifacts,.gate1/local-stack .gate1/runtime/windows.ts retired |& tee .gate1-artifacts/window-retired.log
      - name: Execute transaction assertions against actual local Auth Storage fixtures
        shell: bash
        run: |
          set -euo pipefail
          source .gate1/local-stack/fixture.env
          python3 .gate1/tests/prepare_original_transaction.py
          psql -X -v ON_ERROR_STOP=1 -v a_uid="$a_uid" -v b_uid="$b_uid" -v a_request="$a_request" -v b_request="$b_request" -v a_photo="$a_photo" -v b_photo="$b_photo" -f .gate1-artifacts/transaction-ci.psql |& tee .gate1-artifacts/local-transaction.log
          psql -X -v ON_ERROR_STOP=1 -f .gate1/tests/postflight-assert.psql |& tee .gate1-artifacts/local-postflight-transaction.log
          psql -X -v ON_ERROR_STOP=1 -v a_uid="$a_uid" -v b_uid="$b_uid" -v a_request="$a_request" -v b_request="$b_request" -f .gate1/dev01b/cleanup_drafts.psql |& tee .gate1-artifacts/local-draft-cleanup.log
      - name: Original Edge cleanup recovery and durable manifest verification
        shell: bash
        run: |
          set -euo pipefail
          deno run --cached-only --no-prompt --deny-net=rfwqcrvxyjhtmafnbuyy.supabase.co --allow-net=127.0.0.1,localhost --allow-env --allow-read=.gate1,.gate1-artifacts/local-fixture-manifest.json --allow-write=.gate1-artifacts,.gate1/local-stack .gate1/runtime/fixtures.ts cleanup |& tee .gate1-artifacts/original-edge-cleanup.log
      - name: Real loopback HTTP member submission success denial retry concurrency
        shell: bash
        run: |
          set -euo pipefail
          deno run --cached-only --no-prompt --deny-net=rfwqcrvxyjhtmafnbuyy.supabase.co --allow-net=127.0.0.1,localhost --allow-env --allow-read=.gate1,.gate1-artifacts/local-fixture-manifest.json --allow-write=.gate1-artifacts,.gate1/local-stack .gate1/runtime/submit_api.ts |& tee .gate1-artifacts/submit-http-api.log
          psql -X -v ON_ERROR_STOP=1 -f .gate1/runtime/local-postflight.sql |& tee .gate1-artifacts/local-final-postflight.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          if-no-files-found: error
          name: gate1-local-supabase-api
          path: .gate1-artifacts/
      - name: Destroy local containers and volumes
        if: always()
        run: supabase stop --workdir .gate1/local-stack --no-backup

  p1-fix-c09-v5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated C09 V5 browser contract
        run: python3 .gate1/tests/p1-fix-contract.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check browser module syntax
        run: deno check app/c09-v5.js
      - name: Install headless Chromium for real browser safety test
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run real Chromium C09 V5 fail-closed UI test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory app >/tmp/p1-http.log 2>&1 &
          node .gate1/tests/p1-browser.cjs


  gate1-result:
    if: always() && github.ref == 'refs/heads/test/dev01b-v5-gate1-20261108'
    needs: [isolated-pg17, v5-pg17-migration, deno-runtime, v5-transaction-rls, local-supabase-api]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gate1-*
          path: .gate1-evidence
      - name: Require all jobs and machine-readable assertions before declaring PASS
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .gate1/tests/report_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          if-no-files-found: error
          name: gate1-final-report
          path: .gate1-final/

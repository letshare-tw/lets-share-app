name: DEV-01B V5 Gate 1 isolated runtime
on:
  push:
    branches: ['test/dev01b-v5-gate1-20261108']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: gate1_local_only
          POSTGRES_DB: gate1
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gate1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: gate1_local_only
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: gate1
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned DEV-01B source inputs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check .gate1/SHA256SUMS
      - name: PostgreSQL 17 runtime and isolated transaction rollback
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -Atc "SHOW server_version;" | tee pg-version.txt
          test "$(psql -X -Atc 'SHOW server_version_num')" -ge 170000
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          BEGIN;
          CREATE SCHEMA gate1_smoke;
          CREATE TABLE gate1_smoke.rollback_probe (id integer primary key);
          INSERT INTO gate1_smoke.rollback_probe VALUES (1);
          DO $$ BEGIN
            IF (SELECT count(*) FROM gate1_smoke.rollback_probe) <> 1 THEN
              RAISE EXCEPTION 'transaction insert failed';
            END IF;
          END $$;
          ROLLBACK;
          DO $$ BEGIN
            IF to_regclass('gate1_smoke.rollback_probe') IS NOT NULL THEN
              RAISE EXCEPTION 'rollback failed';
            END IF;
          END $$;
          SQL
          echo 'PASS: PostgreSQL 17 isolated transaction rollback' | tee pg-result.txt
      - name: Apply DEV-01B V5 ledger migration and assert grants
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f .gate1/dev01b/ledger_design.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname='dev01b_test') THEN RAISE EXCEPTION 'ledger schema absent'; END IF;
            IF has_schema_privilege('authenticated','dev01b_test','USAGE') OR has_schema_privilege('anon','dev01b_test','USAGE') THEN RAISE EXCEPTION 'ledger schema exposed'; END IF;
            IF has_function_privilege('authenticated','public.dev01b_v5_claim(text,uuid,boolean)','EXECUTE') OR has_function_privilege('anon','public.dev01b_v5_claim(text,uuid,boolean)','EXECUTE') THEN RAISE EXCEPTION 'claim exposed'; END IF;
            IF NOT has_function_privilege('service_role','public.dev01b_v5_claim(text,uuid,boolean)','EXECUTE') THEN RAISE EXCEPTION 'service role missing grant'; END IF;
          END $$;
          SQL
          echo 'PASS: V5 ledger migration and basic grants' | tee ledger-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate1-pg17-smoke
          path: |
            pg-version.txt
            pg-result.txt
            ledger-result.txt
  deno-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned DEV-01B source inputs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check .gate1/SHA256SUMS
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno runtime and project source availability
        shell: bash
        run: |
          set -euo pipefail
          deno --version | tee deno-version.txt
          if [ ! -f .gate1/dev01b/index.ts ]; then
            echo 'BLOCKED: original DEV-01B index.ts not yet present in test branch' | tee deno-result.txt
            exit 2
          fi
          deno check .gate1/dev01b/index.ts |& tee deno-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate1-deno-check
          path: |
            deno-version.txt
            deno-result.txt


name: AUTH-UI-004 Page Restore V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extend page restoration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("mod-preview/js/legacy-01.js")
          s=p.read_text(encoding="utf-8")

          old='''const lxMemberPages=[
            "me","orders","myshares","wallet","favorites"
          ];'''

          new='''const lxMemberPages=[
            "home","categories","cart",
            "me","orders","myshares","wallet","favorites"
          ];'''

          if s.count(old)!=1:
              if new in s:
                  print("Already installed")
                  raise SystemExit(0)
              raise SystemExit("Page list not found")

          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          print("AUTH-UI-004 V2 installed")
          PY

      - name: Check JavaScript
        run: node --check mod-preview/js/legacy-01.js

      - name: Verify routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("mod-preview/js/legacy-01.js").read_text()
          start=s.index("const lxMemberPages=[")
          end=s.index("];",start)
          routes=s[start:end]
          for route in [
              "home","categories","cart","me",
              "orders","myshares","wallet","favorites"
          ]:
              assert '"'+route+'"' in routes,route
          print("All supported routes verified")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod-preview/js/legacy-01.js
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "AUTH-UI-004 V2 restore main pages"
            git push
          fi

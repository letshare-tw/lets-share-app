name: MOD-03 Preview Google OAuth fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix OAuth only in isolated preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mod-preview/js/legacy-15.js')
          s = p.read_text(encoding='utf-8')
          old_redirect = "const googleRedirect='https://lets-share.com.tw/';"
          new_redirect = "const googleRedirect='https://lets-share.com.tw/mod-preview/';"
          old_path = "!['/app/','/app/index.html'].includes(location.pathname)"
          new_path = "!['/app/','/app/index.html','/mod-preview/','/mod-preview/index.html'].includes(location.pathname)"
          if old_redirect in s:
              assert s.count(old_redirect) == 1
              s = s.replace(old_redirect, new_redirect)
          else:
              assert new_redirect in s, 'OAuth redirect pattern not found'
          if old_path in s:
              assert s.count(old_path) == 1
              s = s.replace(old_path, new_path)
          else:
              assert new_path in s, 'OAuth path restriction pattern not found'
          p.write_text(s, encoding='utf-8')
          print('Preview OAuth redirect and path checks verified')
          PY
      - name: Commit preview-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mod-preview/js/legacy-15.js
          if git diff --cached --quiet; then
            echo 'Already patched'
          else
            git commit -m 'MOD-03 fix preview-only Google OAuth path and redirect'
            git push origin HEAD:main
          fi
          echo 'Supabase Auth URL Configuration must allow https://lets-share.com.tw/mod-preview/'

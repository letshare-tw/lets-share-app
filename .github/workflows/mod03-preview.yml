name: MOD-03 Isolated browser preview

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mod03-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production files remain untouched)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy modularized candidate into isolated preview folder
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin mod-02-candidate
          mkdir -p mod-preview
          git archive origin/mod-02-candidate app/ | tar -x -C "${RUNNER_TEMP}"
          test -f "${RUNNER_TEMP}/app/index.html"
          test -f "${RUNNER_TEMP}/app/js/legacy-20.js"
          test -f "${RUNNER_TEMP}/app/css/legacy-14.css"
          rm -rf mod-preview
          mkdir -p mod-preview
          cp -a "${RUNNER_TEMP}/app/." mod-preview/
          test -f mod-preview/index.html
          echo "Preview source: mod-02-candidate"
          echo "Preview destination: /mod-preview/"
          echo "Production /app/ is not modified."

      - name: Publish preview files to main without changing /app/
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- mod-preview
          if git diff --cached --quiet; then
            echo "Preview already current"
          else
            git commit -m "MOD-03 publish isolated modularized preview"
            git push origin HEAD:main
          fi
          echo "Open: https://lets-share.com.tw/mod-preview/"
          echo "NOTE: OAuth redirects may still point to /app/; do not treat this as an authentication pass."
